name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 패키지 설치
        run: npm ci

      - name: TypeScript 타입 검사
        run: npm run typecheck

      - name: Expo Web 빌드 검증
        run: npm run build:web
