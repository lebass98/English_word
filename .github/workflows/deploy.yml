name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만 진행
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 패키지 설치
        run: npm ci

      - name: TypeScript 타입 검사
        run: npm run typecheck

      - name: Expo Web 정적 사이트 빌드
        run: npm run build:web

      - name: GitHub Pages 호환성 설정 (.nojekyll 및 404 리다이렉트)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: GitHub Pages 환경 설정
        uses: actions/configure-pages@v5

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
